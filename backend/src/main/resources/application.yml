spring:
  application:
    name: teamora-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/teamora}
    username: ${SPRING_DATASOURCE_USERNAME:teamora}
    password: ${SPRING_DATASOURCE_PASSWORD:teamora}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; JPA only validates it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kuala_Lumpur

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  # Behind a TLS reverse proxy (Caddy/nginx): honour X-Forwarded-* from trusted
  # (private-range / loopback) proxies, so the client IP and scheme are real.
  forward-headers-strategy: native
  error:
    # Never leak exception messages through Spring's /error page.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

teamora:
  # dev | production. production turns on the startup safety checks
  # (see ProductionSafetyCheck) and switches off the Swagger UI / API docs.
  env: ${TEAMORA_ENV:dev}
  # Demo data seeding (idempotent — only runs when the DB is empty). Off unless asked for.
  seed: ${TEAMORA_SEED:false}
  jwt:
    # HS256 secret — REQUIRED (no default), >= 32 bytes. The app refuses to start without it.
    secret: ${TEAMORA_JWT_SECRET:}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14
    # A just-rotated refresh token replayed within this window (a retry after a lost
    # response) gets a fresh pair instead of being treated as token theft.
    refresh-reuse-grace-seconds: 60
  cors:
    # Comma-separated allowed origins for web clients, or * (no credentials) for any.
    allowed-origins: ${TEAMORA_CORS_ORIGINS:*}
  password-reset:
    # false → forgot-password answers 200 but creates/sends nothing (no email provider yet).
    enabled: ${PASSWORD_RESET_ENABLED:true}
    # Which PasswordResetSender delivers the code. "log" writes it to the server log (dev only).
    sender: ${PASSWORD_RESET_SENDER:log}
    # LOCAL DEV ONLY: echo the one-time code back as `devCode` from
    # POST /api/auth/forgot-password. Refused at startup in production.
    expose-code: ${PASSWORD_RESET_EXPOSE_CODE:false}
    # Per-account cap on reset codes per 24h (on top of 3 per 15 min).
    max-codes-per-day: 10
  rate-limit:
    enabled: true
    login-per-email: { max: 10, window: 15m }
    login-per-ip: { max: 30, window: 15m }
    register-per-ip: { max: 5, window: 1m }
    forgot-password-per-ip: { max: 5, window: 1m }
    reset-password-per-ip: { max: 10, window: 15m }
  # Hard cap on any request body (bytes) — 413 above it. 3.5 MB fits a 2 MB photo as base64.
  max-request-bytes: 3670016

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Status only (UP/DOWN, includes the DB check) — no component details to anyone.
      show-details: never
      show-components: never

logging:
  pattern:
    # Every log line carries the request id (X-Request-Id) of the request that produced it.
    level: "%5p [%X{requestId:-}]"
  level:
    org.springframework.security: INFO
